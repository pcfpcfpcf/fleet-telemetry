services:
  # L1 Device Simulators — opt-in only, not needed with a real FMC003
  simulator:
    profiles: [simulate]
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fleet-simulator
    depends_on:
      adapter:
        condition: service_healthy
    command: ["--no-ui", "--debug", "--host", "adapter", "--port", "18883", "--imei", "352093114305801", "--latitude", "36.8065", "--longitude", "10.1815"]
    networks:
      - fleet-network
    restart: unless-stopped

  simulator-2:
    profiles: [simulate]
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fleet-simulator-2
    depends_on:
      adapter:
        condition: service_healthy
    command: ["--no-ui", "--debug", "--host", "adapter", "--port", "18883", "--imei", "352093114305802", "--latitude", "36.8115", "--longitude", "10.1865"]
    networks:
      - fleet-network
    restart: unless-stopped

  simulator-3:
    profiles: [simulate]
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fleet-simulator-3
    depends_on:
      adapter:
        condition: service_healthy
    command: ["--no-ui", "--debug", "--host", "adapter", "--port", "18883", "--imei", "352093114305803", "--latitude", "36.8165", "--longitude", "10.1915"]
    networks:
      - fleet-network
    restart: unless-stopped

  simulator-4:
    profiles: [simulate]
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fleet-simulator-4
    depends_on:
      adapter:
        condition: service_healthy
    command: ["--no-ui", "--debug", "--host", "adapter", "--port", "18883", "--imei", "352093114305804", "--latitude", "36.8215", "--longitude", "10.1965"]
    networks:
      - fleet-network
    restart: unless-stopped

  simulator-5:
    profiles: [simulate]
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fleet-simulator-5
    depends_on:
      adapter:
        condition: service_healthy
    command: ["--no-ui", "--debug", "--host", "adapter", "--port", "18883", "--imei", "352093114305805", "--latitude", "36.8265", "--longitude", "10.2015"]
    networks:
      - fleet-network
    restart: unless-stopped
  # L2 Adapter: Teltonika TCP → decode Codec 8 → NATS
  adapter:
    build:
      context: ./adapter
      dockerfile: Dockerfile
    container_name: fleet-adapter
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "18883:18883"
    environment:
      TCP_PORT: 18883
      NATS_URL: nats://nats:4222
      NATS_USER: adapter
      NATS_PASS: ${NATS_ADAPTER_PASSWORD}
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # L3 Message Queue: NATS JetStream
  nats:
    image: nats:2.10-alpine
    container_name: fleet-nats
    ports:
      - "4222:4222"    # Client connections
      - "8222:8222"    # Monitoring HTTP
    command: [
      "--js",
      "-c",
      "/etc/nats/nats.conf"
    ]
    volumes:
      - ./data/nats:/data/nats
      - ./config/nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # L4 Processing: TimescaleDB (Time-series database)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: fleet-timescaledb
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${TIMESCALE_DB}
      POSTGRES_USER: ${TIMESCALE_USER}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=timescaledb"
    volumes:
      - ./data/timescaledb:/var/lib/postgresql/data
      - ./init/timescaledb/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER} -d ${TIMESCALE_DB}"]
      interval: 30s
      timeout: 30s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  # L4 Processing: Node.js Service
  l4-service:
    build:
      context: ./l4-service
      dockerfile: Dockerfile
    container_name: fleet-l4-service
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "3000:3000"    # REST API
      - "3001:3001"    # WebSocket
    environment:
      NATS_URL: nats://nats:4222
      NATS_USER: l4service
      NATS_PASS: ${NATS_L4_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
      WS_PORT: 3001
      NODE_ENV: development
      API_KEY: ${API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      VEHICLE_ACTIVE_WINDOW_MINUTES: ${VEHICLE_ACTIVE_WINDOW_MINUTES:-15}
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # L5 Presentation: Odoo 17
  odoo-init:
    image: odoo:17
    user: root
    container_name: fleet-odoo-init
    command: >
      bash -c "
        if [ ! -f /var/lib/odoo/.initialized ]; then
          echo 'Initializing Odoo database...' &&
          odoo -d odoo --init=base --stop-after-init &&
          touch /var/lib/odoo/.initialized &&
          echo 'Init complete.'
        else
          echo 'Already initialized, skipping.'
        fi
      "
    depends_on:
      odoo-db:
        condition: service_healthy

    environment:
      HOST: odoo-db
      PORT: 5432
      USER: ${ODOO_USER:-odoo}
      PASSWORD: ${ODOO_PASSWORD:-odoo}
      PGSSLMODE: prefer
    volumes:
      - ./data/odoo:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
      - ./config/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
    networks:
      - fleet-network
    restart: "no"

  odoo:
    image: odoo:17
    user: root
    container_name: fleet-odoo
    depends_on:
      odoo-module-init:
        condition: service_completed_successfully
      odoo-db:
        condition: service_healthy
      l4-service:
        condition: service_healthy
        required: false 
    ports:
      - "8069:8069"    # Web UI
      - "8072:8072"    # WebSocket/longpolling
    environment:
      HOST: odoo-db
      PORT: 5432
      USER: ${ODOO_USER:-odoo}
      PASSWORD: ${ODOO_PASSWORD:-odoo}
      PGSSLMODE: prefer
      L4_API_KEY: ${API_KEY}
      ADDONS_PATH: /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
    volumes:
      - ./data/odoo:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
      - ./config/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  odoo-module-init:
    image: odoo:17
    user: root
    container_name: fleet-odoo-module-init
    depends_on:
      odoo-init:
        condition: service_completed_successfully
      odoo-db:
        condition: service_healthy
    command: >
      odoo -d ${ODOO_DB:-odoo}
      -i fleet_telemetry_connector
      -u fleet_telemetry_connector
      --without-demo=all
      --stop-after-init
    environment:
      HOST: odoo-db
      PORT: 5432
      USER: ${ODOO_USER:-odoo}
      PASSWORD: ${ODOO_PASSWORD:-odoo}
      PGSSLMODE: prefer
      L4_API_KEY: ${API_KEY}
      ADDONS_PATH: /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
    volumes:
      - ./data/odoo:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
      - ./config/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
    networks:
      - fleet-network
    restart: "no"

  # L5 Presentation: Odoo PostgreSQL Database
  odoo-db:
    image: postgres:15
    container_name: fleet-odoo-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${ODOO_DB:-odoo}
      POSTGRES_USER: ${ODOO_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_PASSWORD:-odoo}
    volumes:
      - ./data/odoo-db:/var/lib/postgresql/data
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_USER:-odoo} -d ${ODOO_DB:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  fleet-network:
    driver: bridge
    name: fleet-network

volumes: {}