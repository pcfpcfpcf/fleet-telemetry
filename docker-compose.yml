services:
  # L1 Device Simulator (starts by default)
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: fleet-simulator
    depends_on:
      emqx:
        condition: service_healthy
    environment:
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      MQTT_PROTOCOL: mqtt
    networks:
      - fleet-network
    restart: unless-stopped

  # L2 Transport: EMQX MQTT Broker
  emqx:
    image: emqx/emqx:5.3.0
    user: root
    container_name: fleet-emqx
    ports:
      - "1883:1883"    # MQTT plain (local dev)
      - "8883:8883"    # MQTT over TLS (production)
      - "18083:18083"  # Admin dashboard
    environment:
      EMQX_LISTENERS__TCP__DEFAULT__BIND: "0.0.0.0:1883"
      EMQX_DASHBOARD__LISTENERS__HTTP__BIND: "0.0.0.0:18083"
      EMQX_AUTHORIZATION__NO_MATCH: "allow"
      EMQX_LOG__CONSOLE__LEVEL: "warning"
    volumes:
      - ./data/emqx:/opt/emqx/data
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # L3 Ingestion: Traccar (Protocol Decoder only)
  traccar:
    image: traccar/traccar:latest
    container_name: fleet-traccar
    depends_on:
      emqx:
        condition: service_healthy
    ports:
      - "5055:5055"    # Teltonika protocol input
      - "8082:8082"    # Web UI + webhook output
    volumes:
      - ./data/traccar:/opt/traccar/data
      - ./config/traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # L3 Message Queue: NATS JetStream
  nats:
    image: nats:2.10-alpine
    container_name: fleet-nats
    depends_on:
      emqx:
        condition: service_healthy
    ports:
      - "4222:4222"    # Client connections
      - "8222:8222"    # Monitoring HTTP
    command: [
      "--js",
      "-c",
      "/etc/nats/nats.conf"
    ]
    volumes:
      - ./data/nats:/data/nats
      - ./config/nats/nats.conf:/etc/nats/nats.conf:ro
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # L3 Bridge: MQTT to NATS Adapter
  adapter:
    build:
      context: ./adapter
      dockerfile: Dockerfile
    container_name: fleet-adapter
    depends_on:
      emqx:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      MQTT_PROTOCOL: mqtt
      NATS_URL: nats://nats:4222
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # L4 Processing: TimescaleDB (Time-series database)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: fleet-timescaledb
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${TIMESCALE_DB}
      POSTGRES_USER: ${TIMESCALE_USER}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=timescaledb"
    volumes:
      - ./data/timescaledb:/var/lib/postgresql/data
      - ./init/timescaledb/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet || (echo 'Healthcheck failed:'; pg_isready -U fleet -d fleet; exit 1)"]
      interval: 30s
      timeout: 20s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  # L4 Processing: Node.js Service
  l4-service:
    build:
      context: ./l4-service
      dockerfile: Dockerfile
    container_name: fleet-l4-service
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "3000:3000"    # REST API
      - "3001:3001"    # WebSocket
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
      WS_PORT: 3001
      NODE_ENV: development
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # L5 Presentation: Odoo 17
  odoo:
    image: odoo:17
    container_name: fleet-odoo
    depends_on:
      odoo-db:
        condition: service_healthy
      l4-service:
        condition: service_healthy
        required: false
    ports:
      - "8069:8069"    # Web UI
      - "8072:8072"    # WebSocket/longpolling
    environment:
      HOST: odoo-db
      PORT: 5432
      USER: ${ODOO_USER}
      PASSWORD: ${ODOO_PASSWORD}
      ADDONS_PATH: /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
    volumes:
      - ./data/odoo:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    profiles:
      - with-odoo

  # L5 Presentation: Odoo PostgreSQL Database
  odoo-db:
    image: postgres:15
    container_name: fleet-odoo-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${ODOO_DB}
      POSTGRES_USER: ${ODOO_USER}
      POSTGRES_PASSWORD: ${ODOO_PASSWORD}
    volumes:
      - ./data/odoo-db:/var/lib/postgresql/data
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - with-odoo

networks:
  fleet-network:
    driver: bridge
    name: fleet-network

volumes: {}
