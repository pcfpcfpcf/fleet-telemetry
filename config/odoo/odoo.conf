[options]
; ── Database connection ────────────────────────────────────────────────────────
db_host = odoo-db
db_port = 5432
db_user = odoo
db_password = odoo
db_sslmode = prefer

; db_name must NOT be set here — it forces a single DB and breaks the selector.
; The database is chosen via dbfilter + the login page / -d flag on init.

; Filter to only show the "odoo" database on the login screen.
; Use .* during development if you need the DB selector.
dbfilter = ^odoo$

; ── Reverse proxy / Docker ─────────────────────────────────────────────────────
; Required when Odoo runs behind a reverse proxy or inside Docker with port mapping.
; Without this, Odoo uses the internal container address for redirects → login loops.
proxy_mode = True

; ── Paths ─────────────────────────────────────────────────────────────────────
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; ── Workers (0 = threaded/dev mode — fine for single-server Docker) ───────────
workers = 0

; ── Logging ───────────────────────────────────────────────────────────────────
log_level = info
