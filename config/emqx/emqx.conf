# Minimal EMQX 5.3.0 config for local development
# Goal: plain MQTT on 1883 and dashboard on 18083

node {
  name = "emqx@127.0.0.1"
  cookie = "fleet-emqx-cookie"
  data_dir = "/opt/emqx/data"
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/certs/ca.crt"
    certfile   = "/opt/emqx/certs/server.crt"
    keyfile    = "/opt/emqx/certs/server.key"
    # verify_none: server presents its cert, client does not need one.
    # The FMC003 can optionally verify the CA by loading ca.crt via Teltonika Configurator.
    verify     = verify_none
  }
}

# Keep plain MQTT on 1883 for internal services only
listeners.tcp.default {
  bind = "0.0.0.0:1883"
}

dashboard.listeners.http {
  bind = "0.0.0.0:18083"
}

# Keep management listener valid but local-only
management.listeners.http {
  bind = "127.0.0.1:8081"
}
