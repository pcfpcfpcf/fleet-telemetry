name: Demo Smoke Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
      - testing
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Prepare writable bind-mount directories
        run: |
          set -euo pipefail
          mkdir -p data/emqx data/nats data/timescaledb data/traccar data/odoo data/odoo-db
          chmod -R 777 data
          ls -ld data data/*

      - name: Start full telemetry stack (L1-L4)
        run: |
          docker compose up -d emqx traccar nats timescaledb adapter l4-service simulator

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          services=(emqx traccar nats timescaledb adapter l4-service)
          timeout_secs=360
          elapsed=0

          while [ "$elapsed" -lt "$timeout_secs" ]; do
            all_healthy=true
            for svc in "${services[@]}"; do
              cid=$(docker compose ps -q "$svc")
              if [ -z "$cid" ]; then
                all_healthy=false
                break
              fi
              status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
              if [ "$status" != "healthy" ]; then
                all_healthy=false
                break
              fi
            done

            if [ "$all_healthy" = true ]; then
              echo "All core services are healthy"
              exit 0
            fi

            sleep 5
            elapsed=$((elapsed + 5))
          done

          echo "Core services failed to reach healthy state in time"
          docker compose ps
          docker compose logs --tail 120 emqx nats timescaledb adapter || true
          exit 1

      - name: Wait for simulator traffic
        run: |
          sleep 60

      - name: Validate adapter forwarding evidence
        run: |
          set -euo pipefail
          logs=$(docker logs fleet-adapter --tail 1200 2>&1 || true)
          echo "$logs" | tail -n 120

          for device in FMC003_SIM_001 FMC003_SIM_002 FMC003_SIM_003 FMC003_SIM_004 FMC003_SIM_005; do
            echo "$logs" | grep -q "$device"
          done

          echo "$logs" | grep -q "NATS"

      - name: Validate L4 health and vehicles API
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/health

          vehicles_json=$(curl -fsS http://localhost:3000/vehicles)
          echo "$vehicles_json" | head -c 500

          if ! echo "$vehicles_json" | grep -q '"success":true'; then
            echo "L4 vehicles endpoint did not return success=true"
            exit 1
          fi

          if ! echo "$vehicles_json" | grep -q 'FMC003_SIM_00'; then
            echo "L4 vehicles endpoint did not include simulated devices"
            exit 1
          fi

      - name: Validate telemetry persisted in TimescaleDB
        run: |
          set -euo pipefail
          count=$(docker exec fleet-timescaledb psql -U fleet -d fleet -Atc "select count(*) from telemetry;")
          echo "Telemetry row count: $count"

          if [ "${count:-0}" -le 0 ]; then
            echo "No telemetry rows found in TimescaleDB"
            exit 1
          fi

      - name: Validate WebSocket telemetry broadcast
        shell: pwsh
        run: |
          $output = pwsh -NoProfile -File ./scripts/ws-test.ps1 -Url "ws://localhost:3001" -DurationSeconds 15 | Out-String
          Write-Host $output
          if ($output -notmatch "CONNECTED") {
            throw "WebSocket did not connect"
          }
          if ($output -notmatch "MESSAGE") {
            throw "WebSocket did not receive telemetry messages"
          }

      - name: Validate NATS monitor endpoint
        run: |
          docker exec fleet-nats wget -qO- http://localhost:8222/jsz | head -c 300

      - name: Dump status and key logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail 120 emqx traccar nats adapter timescaledb l4-service simulator || true

      - name: Teardown
        if: always()
        run: |
          set +e
          docker compose down -v --remove-orphans
          docker rm -f fleet-simulator >/dev/null 2>&1 || true
          docker network rm fleet-network >/dev/null 2>&1 || true
          true
