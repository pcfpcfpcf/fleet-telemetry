name: Demo Smoke Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - master
      - testing
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIMESCALE_DB: ${{ secrets.TIMESCALE_DB }}
      TIMESCALE_USER: ${{ secrets.TIMESCALE_USER }}
      TIMESCALE_PASSWORD: ${{ secrets.TIMESCALE_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NATS_ADAPTER_PASSWORD: ${{ secrets.NATS_ADAPTER_PASSWORD }}
      NATS_L4_PASSWORD: ${{ secrets.NATS_L4_PASSWORD }}
      API_KEY: ${{ secrets.API_KEY }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Prepare writable bind-mount directories
        run: |
          set -euo pipefail
          mkdir -p data/emqx data/nats data/timescaledb data/traccar data/odoo data/odoo-db certs
          chmod -R 777 data
          ls -ld data data/*

      - name: Generate mTLS certs for EMQX and simulator
        run: |
          set -euo pipefail
          rm -f certs/*

          openssl genrsa -out certs/ca.key 4096
          openssl req -new -x509 -days 3650 -key certs/ca.key -out certs/ca.crt -subj "/C=TN/ST=Tunis/L=Tunis/O=FleetPlatform/CN=FleetCA"

          openssl genrsa -out certs/server.key 2048
          openssl req -new -key certs/server.key -out certs/server.csr -subj "/C=TN/ST=Tunis/L=Tunis/O=FleetPlatform/CN=emqx"
          openssl x509 -req -days 825 -in certs/server.csr -CA certs/ca.crt -CAkey certs/ca.key -CAcreateserial -out certs/server.crt

          openssl genrsa -out certs/simulator-client.key 2048
          openssl req -new -key certs/simulator-client.key -out certs/simulator-client.csr -subj "/C=TN/ST=Tunis/L=Tunis/O=FleetPlatform/CN=simulator"
          openssl x509 -req -days 825 -in certs/simulator-client.csr -CA certs/ca.crt -CAkey certs/ca.key -CAcreateserial -out certs/simulator-client.crt

          ls -la certs

      - name: Clean timescaledb data directory (force fresh DB)
        run: |
          set -euo pipefail
          if [ -d data/timescaledb ]; then
            rm -rf data/timescaledb/*
            echo "Cleaned data/timescaledb for fresh TimescaleDB init"
          else
            mkdir -p data/timescaledb
            echo "Created data/timescaledb directory"
          fi

      - name: Start TimescaleDB only
        run: |
          docker compose up -d timescaledb

      - name: Wait for TimescaleDB to be healthy
        run: |
          set -euo pipefail
          timeout_secs=300
          elapsed=0
          while [ "$elapsed" -lt "$timeout_secs" ]; do
            cid=$(docker compose ps -q timescaledb)
            if [ -z "$cid" ]; then
              echo "timescaledb container not found"
              docker compose ps
              exit 1
            fi
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
            if [ "$status" = "healthy" ]; then
              echo "timescaledb is healthy"
              exit 0
            fi
            echo "Waiting for timescaledb to be healthy... (status: $status)"
            docker inspect "$cid" || true
            docker compose logs --tail 80 timescaledb || true
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "timescaledb did not become healthy in time"
          docker inspect "$cid" || true
          docker compose logs --tail 200 timescaledb
          exit 1

      - name: Start remaining telemetry stack (L1-L4)
        run: |
          docker compose up -d emqx traccar nats adapter l4-service simulator

      - name: Wait for timescaledb to be healthy
        run: |
          set -euo pipefail
          timeout_secs=480
          elapsed=0
          while [ "$elapsed" -lt "$timeout_secs" ]; do
            cid=$(docker compose ps -q timescaledb)
            if [ -z "$cid" ]; then
              echo "timescaledb container not found"
              docker compose ps
              exit 1
            fi
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
            if [ "$status" = "healthy" ]; then
              echo "timescaledb is healthy"
              exit 0
            fi
            echo "Waiting for timescaledb to be healthy... (status: $status)"
            docker inspect "$cid" || true
            docker compose logs --tail 80 timescaledb || true
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "timescaledb did not become healthy in time"
          docker inspect "$cid" || true
          docker compose logs --tail 200 timescaledb
          exit 1

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          services=(emqx traccar nats timescaledb adapter l4-service)
          timeout_secs=540
          elapsed=0

          while [ "$elapsed" -lt "$timeout_secs" ]; do
            all_healthy=true
            for svc in "${services[@]}"; do
              cid=$(docker compose ps -q "$svc")
              if [ -z "$cid" ]; then
                all_healthy=false
                break
              fi
              status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
              if [ "$status" != "healthy" ]; then
                all_healthy=false
                break
              fi
            done

            if [ "$all_healthy" = true ]; then
              echo "All core services are healthy"
              exit 0
            fi

            sleep 5
            elapsed=$((elapsed + 5))
          done

          echo "Core services failed to reach healthy state in time"
          docker compose ps
          docker compose logs --tail 120 emqx nats timescaledb adapter || true
          exit 1

      - name: Wait for simulator traffic
        run: |
          sleep 60

      - name: Validate adapter forwarding evidence
        run: |
          set -euo pipefail
          logs=$(docker logs fleet-adapter --tail 1200 2>&1 || true)
          sim_logs=$(docker logs fleet-simulator --tail 400 2>&1 || true)
          emqx_logs=$(docker logs fleet-emqx --tail 200 2>&1 || true)
          devices=(352093114305801 352093114305802 352093114305803 352093114305804 352093114305805)

          echo "=== ADAPTER LOGS (tail) ==="
          echo "$logs" | tail -n 120
          echo "=== SIMULATOR LOGS (tail) ==="
          echo "$sim_logs" | tail -n 80
          echo "=== EMQX LOGS (tail) ==="
          echo "$emqx_logs" | tail -n 80

          for device in "${devices[@]}"; do
            if ! echo "$logs" | grep -q "$device"; then
              echo "Missing forwarded device in adapter logs: $device"
              exit 1
            fi
          done

          if ! echo "$logs" | grep -q "NATS"; then
            echo "Adapter logs did not include NATS forwarding evidence"
            exit 1
          fi

      - name: Validate TimescaleDB schema readiness
        run: |
          set -euo pipefail
          table_count=$(docker exec fleet-timescaledb psql -U fleet -d fleet -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name='telemetry';")
          echo "telemetry table count: $table_count"

          if [ "${table_count:-0}" -lt 1 ]; then
            echo "Telemetry table was not initialized"
            docker compose logs --tail 200 timescaledb || true
            exit 1
          fi

      - name: Validate L4 health and vehicles API
        run: |
          set -euo pipefail
          # Wait until health endpoint is reachable.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null; then
              break
            fi
            sleep 2
          done

          # Poll vehicles endpoint because DB/consumer warm-up can briefly return 500.
          ok=false
          for i in $(seq 1 20); do
            response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -H "X-API-Key: $API_KEY" http://localhost:3000/vehicles || true)
            body=$(echo "$response" | sed '$d')
            code=$(echo "$response" | tail -n1 | sed 's/HTTP_STATUS://')

            if [ "$code" = "200" ] && echo "$body" | grep -q '^\['; then
              echo "$body" | head -c 500
              if echo "$body" | grep -q '35209311430580'; then
                ok=true
                break
              fi
            else
              echo "Attempt $i: /vehicles returned HTTP $code"
              echo "$body" | head -c 300 || true
            fi

            sleep 3
          done

          if [ "$ok" != "true" ]; then
            echo "L4 /vehicles endpoint did not return simulator data in time"
            docker compose logs --tail 120 l4-service timescaledb || true
            exit 1
          fi

      - name: Validate telemetry persisted in TimescaleDB
        run: |
          set -euo pipefail
          count=$(docker exec fleet-timescaledb psql -U fleet -d fleet -Atc "select count(*) from telemetry;")
          echo "Telemetry row count: $count"

          if [ "${count:-0}" -le 0 ]; then
            echo "No telemetry rows found in TimescaleDB"
            exit 1
          fi

      - name: Validate WebSocket telemetry broadcast
        shell: pwsh
        run: |
          $output = pwsh -NoProfile -File ./scripts/ws-test.ps1 -Url "ws://localhost:3001" -DurationSeconds 15 | Out-String
          Write-Host $output
          if ($output -notmatch "CONNECTED") {
            throw "WebSocket did not connect"
          }
          if ($output -notmatch "MESSAGE") {
            throw "WebSocket did not receive telemetry messages"
          }

      - name: Validate NATS monitor endpoint
        run: |
          docker exec fleet-nats wget -qO- http://localhost:8222/jsz | head -c 300

      - name: Dump status and key logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail 120 emqx traccar nats adapter timescaledb l4-service simulator || true

      - name: Teardown
        if: always()
        run: |
          set +e
          docker compose down -v --remove-orphans
          docker rm -f fleet-simulator >/dev/null 2>&1 || true
          docker network rm fleet-network >/dev/null 2>&1 || true
          true

  python-fmc003-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Prepare writable bind-mount directories
        run: |
          set -euo pipefail
          mkdir -p data/emqx certs logs
          chmod -R 777 data certs logs
          ls -ld data data/emqx certs logs

      - name: Generate mTLS certs for EMQX
        run: |
          set -euo pipefail
          rm -f certs/*

          openssl genrsa -out certs/ca.key 4096
          openssl req -new -x509 -days 3650 -key certs/ca.key -out certs/ca.crt -subj "/C=TN/ST=Tunis/L=Tunis/O=FleetPlatform/CN=FleetCA"

          openssl genrsa -out certs/server.key 2048
          openssl req -new -key certs/server.key -out certs/server.csr -subj "/C=TN/ST=Tunis/L=Tunis/O=FleetPlatform/CN=emqx"
          openssl x509 -req -days 825 -in certs/server.csr -CA certs/ca.crt -CAkey certs/ca.key -CAcreateserial -out certs/server.crt

          ls -la certs

      - name: Start EMQX only
        run: |
          docker compose up -d emqx

      - name: Wait for EMQX to be healthy
        run: |
          set -euo pipefail
          timeout_secs=240
          elapsed=0
          while [ "$elapsed" -lt "$timeout_secs" ]; do
            cid=$(docker compose ps -q emqx)
            if [ -z "$cid" ]; then
              echo "emqx container not found"
              docker compose ps
              exit 1
            fi
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
            if [ "$status" = "healthy" ]; then
              echo "emqx is healthy"
              exit 0
            fi
            echo "Waiting for emqx to be healthy... (status: $status)"
            docker inspect "$cid" || true
            docker compose logs --tail 80 emqx || true
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "emqx did not become healthy in time"
          docker inspect "$cid" || true
          docker compose logs --tail 200 emqx
          exit 1

      - name: Install Python MQTT client
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install paho-mqtt

      - name: Start TCP demo server
        run: |
          python3 -u simulator/demo_server.py > logs/demo-server.log 2>&1 &
          echo $! > logs/demo-server.pid

      - name: Start MQTT capture subscriber
        run: |
          printf '%s\n' \
            'import paho.mqtt.client as mqtt' \
            '' \
            'def on_connect(client, userdata, flags, reason_code, properties=None):' \
            '    client.subscribe("teltonika/+/codec8/raw", qos=1)' \
            '' \
            'def on_message(client, userdata, msg):' \
            '    print(f"TOPIC={msg.topic}")' \
            '    print(f"BYTES={len(msg.payload)}")' \
            '    print(msg.payload[:32].hex())' \
            '    client.disconnect()' \
            '' \
            'client = mqtt.Client(' \
            '    callback_api_version=mqtt.CallbackAPIVersion.VERSION2,' \
            '    client_id="ci-mqtt-sub",' \
            ')' \
            'client.on_connect = on_connect' \
            'client.on_message = on_message' \
            'client.connect("127.0.0.1", 1883, 60)' \
            'client.loop_forever()' \
            > /tmp/mqtt_sub.py
          python3 /tmp/mqtt_sub.py > logs/mqtt-sub.log 2>&1 &
          echo $! > logs/mqtt-sub.pid

      - name: Start Python FMC003 simulator in replay mode
        run: |
          python3 -u simulator/main.py \
            --host 127.0.0.1 \
            --port 5055 \
            --imei 352093114305816 \
            --replay-hex-file simulator/sample_packets.hex \
            --replay-loop \
            --replay-interval 1 \
            --mqtt-host 127.0.0.1 \
            --mqtt-port 1883 \
            --mqtt-raw-topic "teltonika/{imei}/codec8/raw" \
            --mqtt-compat-topic "" \
            --debug > logs/python-sim.log 2>&1 &
          echo $! > logs/python-sim.pid

      - name: Wait for MQTT and TCP evidence
        run: |
          set -euo pipefail

          timeout_secs=120
          elapsed=0
          while [ "$elapsed" -lt "$timeout_secs" ]; do
            if grep -q "TOPIC=teltonika/352093114305816/codec8/raw" logs/mqtt-sub.log 2>/dev/null; then
              break
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done

          if ! grep -q "TOPIC=teltonika/352093114305816/codec8/raw" logs/mqtt-sub.log 2>/dev/null; then
            echo "MQTT raw topic was not captured"
            cat logs/mqtt-sub.log || true
            cat logs/python-sim.log || true
            exit 1
          fi

          if ! grep -q "\[demo-server\] packet=" logs/demo-server.log 2>/dev/null; then
            echo "Demo server did not receive Codec 8 packets"
            cat logs/demo-server.log || true
            cat logs/python-sim.log || true
            exit 1
          fi

          echo "=== MQTT SUB LOG ==="
          tail -n 20 logs/mqtt-sub.log || true
          echo "=== PYTHON SIM LOG ==="
          tail -n 40 logs/python-sim.log || true
          echo "=== DEMO SERVER LOG ==="
          tail -n 40 logs/demo-server.log || true

      - name: Teardown
        if: always()
        run: |
          set +e
          if [ -f logs/python-sim.pid ]; then kill "$(cat logs/python-sim.pid)" >/dev/null 2>&1 || true; fi
          if [ -f logs/mqtt-sub.pid ]; then kill "$(cat logs/mqtt-sub.pid)" >/dev/null 2>&1 || true; fi
          if [ -f logs/demo-server.pid ]; then kill "$(cat logs/demo-server.pid)" >/dev/null 2>&1 || true; fi
          docker compose down -v --remove-orphans || true

  odoo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TIMESCALE_DB: ${{ secrets.TIMESCALE_DB }}
      TIMESCALE_USER: ${{ secrets.TIMESCALE_USER }}
      TIMESCALE_PASSWORD: ${{ secrets.TIMESCALE_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODOO_DB: ${{ secrets.ODOO_DB }}
      ODOO_USER: ${{ secrets.ODOO_USER }}
      ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
      NATS_ADAPTER_PASSWORD: ${{ secrets.NATS_ADAPTER_PASSWORD }}
      NATS_L4_PASSWORD: ${{ secrets.NATS_L4_PASSWORD }}
      API_KEY: ${{ secrets.API_KEY }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Prepare writable bind-mount directories
        run: |
          set -euo pipefail
          mkdir -p data/emqx data/nats data/timescaledb data/traccar data/odoo data/odoo-db certs
          chmod -R 777 data
          ls -ld data data/*

      - name: Generate mTLS certs for EMQX and simulator
        run: |
          set -euo pipefail
          rm -f certs/*

          openssl genrsa -out certs/ca.key 4096
          openssl req -new -x509 -days 3650 -key certs/ca.key -out certs/ca.crt -subj "/C=TN/ST=Tunis/L=Tunis/O=FleetPlatform/CN=FleetCA"

          openssl genrsa -out certs/server.key 2048
          openssl req -new -key certs/server.key -out certs/server.csr -subj "/C=TN/ST=Tunis/L=Tunis/O=FleetPlatform/CN=emqx"
          openssl x509 -req -days 825 -in certs/server.csr -CA certs/ca.crt -CAkey certs/ca.key -CAcreateserial -out certs/server.crt

          openssl genrsa -out certs/simulator-client.key 2048
          openssl req -new -key certs/simulator-client.key -out certs/simulator-client.csr -subj "/C=TN/ST=Tunis/L=Tunis/O=FleetPlatform/CN=simulator"
          openssl x509 -req -days 825 -in certs/simulator-client.csr -CA certs/ca.crt -CAkey certs/ca.key -CAcreateserial -out certs/simulator-client.crt

          ls -la certs

      - name: Start services for Odoo integration test
        run: |
          docker compose --profile with-odoo up -d emqx traccar nats timescaledb adapter l4-service simulator odoo-db

      - name: Wait for Odoo DB to be healthy
        run: |
          set -euo pipefail
          timeout_secs=120
          elapsed=0
          while [ "$elapsed" -lt "$timeout_secs" ]; do
            cid=$(docker compose --profile with-odoo ps -q odoo-db)
            if [ -z "$cid" ]; then
              echo "odoo-db container not found"
              docker compose --profile with-odoo ps
              exit 1
            fi
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
            if [ "$status" = "healthy" ]; then
              echo "odoo-db is healthy"
              exit 0
            fi
            echo "Waiting for odoo-db to be healthy... (status: $status)"
            docker inspect "$cid" || true
            docker compose --profile with-odoo logs --tail 20 odoo-db || true
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "odoo-db did not become healthy in time"
          docker inspect "$cid" || true
          docker compose --profile with-odoo logs --tail 100 odoo-db
          exit 1

      - name: Initialize Odoo database and install connector
        run: |
          set -euo pipefail
          docker compose --profile with-odoo run --rm odoo odoo -d odoo -i base --without-demo=all --stop-after-init
          docker compose --profile with-odoo run --rm odoo odoo -d odoo -i fleet_telemetry_connector --stop-after-init
          echo "Listing installed Odoo modules after install:"
          docker compose --profile with-odoo run --rm odoo odoo -d odoo -c "import odoo; odoo.tools.config['addons_path'] = '/mnt/extra-addons'; from odoo.modules.registry import Registry; r = Registry('odoo'); print([m for m in r._init_modules])" || true
          echo "Listing all tables in odoo database after install:"
          docker compose --profile with-odoo run --rm odoo psql -h odoo-db -U odoo -d odoo -c "\\dt" || true

      - name: Start Odoo service
        run: |
          docker compose --profile with-odoo up -d odoo

      - name: Wait for core and Odoo DB services to be healthy
        run: |
          set -euo pipefail
          services=(emqx traccar nats timescaledb adapter l4-service odoo-db)
          timeout_secs=420
          elapsed=0

          while [ "$elapsed" -lt "$timeout_secs" ]; do
            all_healthy=true
            for svc in "${services[@]}"; do
              cid=$(docker compose ps -q "$svc")
              if [ -z "$cid" ]; then
                all_healthy=false
                break
              fi
              status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
              if [ "$status" != "healthy" ]; then
                all_healthy=false
                break
              fi
            done

            if [ "$all_healthy" = true ]; then
              echo "All required services are healthy"
              exit 0
            fi

            sleep 5
            elapsed=$((elapsed + 5))
          done

          echo "Services failed to reach healthy state in time"
          docker compose ps
          docker compose logs --tail 120 emqx nats timescaledb adapter l4-service odoo-db || true
          exit 1

      - name: Initialize Odoo database and install connector
        run: |
          set -euo pipefail
          docker compose --profile with-odoo run --rm odoo odoo -d odoo -i base --without-demo=all --stop-after-init
          docker compose --profile with-odoo run --rm odoo odoo -d odoo -u fleet_telemetry_connector --stop-after-init
          echo "Listing installed Odoo modules after install:"
          docker compose --profile with-odoo run --rm odoo odoo -d odoo -c "import odoo; odoo.tools.config['addons_path'] = '/mnt/extra-addons'; from odoo.modules.registry import Registry; r = Registry('odoo'); print([m for m in r._init_modules])" || true
          echo "Listing all tables in odoo database after install:"
          docker compose --profile with-odoo run --rm odoo psql -h odoo-db -U odoo -d odoo -c "\\dt" || true

      - name: Restart Odoo web service
        run: |
          docker compose --profile with-odoo restart odoo

      - name: Wait for Odoo to be healthy
        run: |
          set -euo pipefail
          timeout_secs=240
          elapsed=0
          while [ "$elapsed" -lt "$timeout_secs" ]; do
            cid=$(docker compose --profile with-odoo ps -q odoo)
            if [ -z "$cid" ]; then
              echo "Odoo container not found. Debugging context:"
              echo "Current directory: $(pwd)"
              echo "Listing all containers (docker ps -a):"
              docker ps -a
              echo "docker compose ps output:"
              docker compose ps
              echo "docker compose config services:"
              docker compose config --services
              exit 1
            fi
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
            if [ "$status" = "healthy" ]; then
              echo "Odoo is healthy"
              exit 0
            fi
            echo "Waiting for Odoo to be healthy... (status: $status)"
            docker inspect "$cid" || true
            docker compose logs --tail 40 odoo || true
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "Odoo did not become healthy"
          docker inspect "$cid" || true
          docker compose logs --tail 200 odoo
          exit 1
          elapsed=0

          while [ "$elapsed" -lt "$timeout_secs" ]; do
            cid=$(docker compose --profile with-odoo ps -q odoo)
            if [ -n "$cid" ]; then
              status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")
              if [ "$status" = "healthy" ]; then
                echo "Odoo is healthy"
                exit 0
              fi
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done

          echo "Odoo did not become healthy"
          docker compose logs --tail 200 odoo || true
          exit 1


      - name: Debug timescaledb before table wait
        run: |
          echo "Checking timescaledb container status..."
          docker compose ps
          docker compose logs --tail 50 timescaledb || true


      - name: Debug odoo-db before table wait
        run: |
          echo "Checking odoo-db container status..."
          docker compose ps
          docker compose logs --tail 100 odoo-db || true
          echo "Listing tables in odoo-db via fleet-odoo-db container:"
          docker exec fleet-odoo-db env PGPASSWORD=odoo psql -U odoo -d odoo -c "\dt" || true


      - name: Wait for fleet_vehicle_telemetry table
        run: |
          echo "Waiting for fleet_vehicle_telemetry table (from fleet-odoo-db container)..."
          for i in {1..60}; do
            if docker exec fleet-odoo-db env PGPASSWORD=odoo psql -U odoo -d odoo -c "\dt" | grep -q fleet_vehicle_telemetry; then
              echo "Table exists."
              exit 0
            fi
            echo "Table not ready yet... retrying ($i/60)"
            docker exec fleet-odoo-db env PGPASSWORD=odoo psql -U odoo -d odoo -c "\dt" || true
            sleep 5
          done

          echo "Table did not appear in time"
          echo "Current tables in database (from fleet-odoo-db container):"
          docker exec fleet-odoo-db env PGPASSWORD=odoo psql -U odoo -d odoo -c "\dt" || true
          echo "Odoo logs:"
          docker compose logs --tail 200 odoo
          echo "Odoo-db logs:"
          docker compose logs --tail 100 odoo-db
          exit 1

      - name: Verify Odoo telemetry data is synced
        run: |
          set -euo pipefail

          timeout_secs=240
          elapsed=0

          while [ "$elapsed" -lt "$timeout_secs" ]; do
            count=$(docker exec fleet-odoo-db psql -U odoo -d odoo -Atc "select count(*) from fleet_vehicle_telemetry;" || echo 0)
            echo "Odoo telemetry row count: $count"

            if [ "${count:-0}" -gt 0 ]; then
              echo "Odoo telemetry sync verified"
              exit 0
            fi

            sleep 10
            elapsed=$((elapsed + 10))
          done

          echo "No telemetry rows were synced to Odoo in time"
          docker compose logs --tail 200 odoo || true
          exit 1

      - name: Dump status and key logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail 120 emqx traccar nats adapter timescaledb l4-service odoo odoo-db simulator || true

      - name: Teardown
        if: always()
        run: |
          set +e
          docker compose --profile with-odoo down -v --remove-orphans
          docker rm -f fleet-simulator >/dev/null 2>&1 || true
          docker network rm fleet-network >/dev/null 2>&1 || true
          true
