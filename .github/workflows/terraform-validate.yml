name: Terraform Validation

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'infra/terraform/**'
  pull_request:
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:

env:
  TERRAFORM_VERSION: 1.5.0

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Navigate to Terraform directory
        run: |
          cd infra/terraform
          pwd

      - name: Terraform Format Check
        run: |
          cd infra/terraform
          terraform fmt -check -recursive -diff

      - name: Terraform Init (validate configuration)
        run: |
          cd infra/terraform
          terraform init --backend=false

      - name: Terraform Validate
        run: |
          cd infra/terraform
          terraform validate

      - name: Terraform Plan (dry-run with mock variables)
        run: |
          cd infra/terraform
          terraform plan \
            -var="db_password=MockPassword123!@#" \
            -var="key_pair_name=mock-key" \
            -var="environment=test" \
            -var="aws_region=me-south-1" \
            -var="project_name=fleet-telemetry" \
            -var="owner_email=ops@example.com" \
            -out=tfplan.out 2>&1 | tee plan_output.txt || true

      - name: Validate plan output
        run: |
          cd infra/terraform
          if grep -q "No changes" plan_output.txt || grep -q "will be created" plan_output.txt; then
            echo "✓ Terraform plan validation successful"
            exit 0
          elif grep -q "Error:" plan_output.txt; then
            echo "✗ Terraform plan failed with errors"
            cat plan_output.txt
            exit 1
          else
            echo "✓ Terraform plan completed"
            exit 0
          fi

      - name: Check for drift in planning
        if: always()
        run: |
          cd infra/terraform
          if grep -q "Failed to parse" plan_output.txt || \
             grep -q "Invalid resource type" plan_output.txt || \
             grep -q "Unsupported argument" plan_output.txt; then
            echo "✗ Terraform configuration contains syntax errors"
            exit 1
          fi
